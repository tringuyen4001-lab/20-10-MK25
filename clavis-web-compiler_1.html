<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
body {
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  padding: 24px;
}

.card {
  max-width: 520px;
  padding: 18px;
  border-radius: 16px;
  border: 1px solid rgba(0, 33, 71, 0.16);
  box-shadow: 0 14px 28px rgba(0, 0, 0, 0.08);
}

h2 {
  margin: 0 0 10px;
  color: #002147;
}

p {
  margin: 0 0 14px;
  line-height: 1.6;
}

button {
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid rgba(0, 33, 71, 0.2);
  background: #DAA520;
  color: #ffffff;
  cursor: pointer;
}

* {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Trái tim rơi nền */
        .heart-particle {
            position: fixed;
            color: #ff4b72;
            font-size: 20px;
            animation: fall linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        /* Card container */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(233, 30, 99, 0.2);
            width: 100%;
            max-width: 420px;
            padding: 25px;
            text-align: center;
            z-index: 10;
            border: 2px solid #ffccd5;
            position: relative;
        }

        /* Lock / Screen 1 */
        .lock-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h2 {
            color: #d81b60;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ff80ab;
            border-radius: 25px;
            outline: none;
            text-align: center;
            font-size: 16px;
            transition: 0.3s;
        }

        input[type="password"]:focus {
            border-color: #c2185b;
            box-shadow: 0 0 8px rgba(194, 24, 91, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #e91e63, #ff4081);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
            transition: transform 0.2s, background 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            background: linear-gradient(45deg, #d81b60, #f50057);
        }

        .hint-box {
            background: #fff0f5;
            border-radius: 12px;
            padding: 10px;
            margin-top: 15px;
            font-size: 13px;
            color: #ad1457;
            border: 1px dashed #ff80ab;
        }

        .error-msg {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        /* Message / Screen 2 */
        #message-screen {
            display: none;
            text-align: left;
        }

        .header-title {
            color: #c2185b;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .typing-content {
            font-size: 14px;
            color: #424242;
            line-height: 1.7;
            white-space: pre-line;
            min-height: 180px;
        }

        .sender {
            margin-top: 15px;
            font-weight: bold;
            color: #d81b60;
            font-size: 15px;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 15px;
            background-color: #e91e63;
            margin-left: 2px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .decor-img {
            width: 100%;
            border-radius: 12px;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
  </style>
</head>
<body>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi lời nhắn yêu thương - TH_26DMK25</title>
    



    <!-- Nhạc nền (Tự động phát sau khi bấm mở khóa) -->
    <audio id="bg-music" loop="">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <!-- Màn hình 1: Nhập mật khẩu -->
        <div id="login-screen">
            <div class="lock-icon">🔒</div>
            <h2>Tin nhắn được bảo vệ</h2>
            <div class="input-group">
                <input type="password" id="password-input" placeholder="Nhập mật khẩu...">
                <div id="error-msg" class="error-msg">Mật khẩu không đúng, vui lòng thử lại!</div>
            </div>
            <button onclick="checkPassword()">XEM TIN NHẮN</button>
            <div class="hint-box">
                💡 <b>Gợi ý:</b> Mật khẩu là mã lớp viết liền (ví dụ: <b>MK25</b>).
            </div>
        </div>

        <!-- Màn hình 2: Nội dung lời chúc -->
        <div id="message-screen">
            <div class="header-title">
                <i>Gửi đến:</i> Gửi những bông hoa xinh đẹp của lớp <b>TH_26DMK25</b>! 🌸✨
            </div>
            
            <div class="typing-content">
                <span id="typed-text"></span><span class="cursor"></span>
            </div>

            <div class="sender">
                Từ: <b>Tập thể Nam sinh TH_26DMK25 💖</b>
            </div>

            <!-- Bạn có thể thay link hình ảnh bên dưới -->
            <img class="decor-img" src="https://images.unsplash.com/photo-1518895949257-7621c3c786d7?q=80&amp;w=600" alt="Flowers">
        </div>
    </div>

  <script>
try {
try {
// Mật khẩu mở khóa (Thay đổi tại đây nếu muốn)
        const CORRECT_PASSWORD = "MK25";

        // Lời chúc tự động gõ chữ
        const messageText = `Chúc một nửa thế giới của TH_26DMK25 có một ngày 20/10 đầu tiên thật trọn vẹn, ngập tràn niềm vui và những nụ cười rạng rỡ! 💖

Cảm ơn các bạn vì đã xuất hiện, làm cho tập thể lớp của chúng ta thêm phần rực rỡ và đáng yêu hơn mỗi ngày.

Chúc các bạn luôn tự tin, hạnh phúc và gặt hái thật nhiều thành công trên con đường phía trước. Chúng mình cùng nhau cố gắng tạo nên thật nhiều kỷ niệm đẹp nhé! 🎉

Happy Vietnamese Women's Day! 💐✨`;

        // Tạo hiệu ứng trái tim rơi
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = ['💖', '🌸', '✨', '💕', '🌷'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }
        setInterval(createHeart, 300);

        // Kiểm tra mật khẩu
        function checkPassword() {
            const input = document.getElementById('password-input').value.trim();
            const errorMsg = document.getElementById('error-msg');

            if (input.toUpperCase() === CORRECT_PASSWORD.toUpperCase()) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('message-screen').style.display = 'block';
                
                // Phát nhạc
                const music = document.getElementById('bg-music');
                music.play().catch(e => console.log("Tự động phát nhạc bị chặn bởi trình duyệt"));

                // Chạy hiệu ứng gõ chữ
                typeWriter(messageText, 0);
            } else {
                errorMsg.style.display = 'block';
            }
        }

        // Bấm Enter để mở khóa
        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // Hiệu ứng gõ chữ (Typing Effect)
        function typeWriter(text, i) {
            if (i < text.length) {
                document.getElementById("typed-text").innerHTML += text.charAt(i) === '\n' ? '<br>' : text.charAt(i);
                setTimeout(() => typeWriter(text, i + 1), 35);
            }
        }

try {
document.getElementById("btn").addEventListener("click", () => {
  alert("Nice! JavaScript đang chạy trong Preview iframe ✅");
});
} catch (error) {
  console.error(error);
}
} catch (error) {
  console.error(error);
}
} catch (error) {
  console.error(error);
}
  </script>
</body>
</html>
